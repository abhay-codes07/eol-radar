# Tools the Play's steps actually invoke. Nothing else is declared: a phantom
# dependency is a barrier to somebody running this for the first time.

[[tools]]
id = "python3"
command = "python3"
required = true

[[tools.install]]
manager = "brew"
package = "python@3.13"

[[tools.install]]
manager = "apt"
package = "python3"

# Needed only for the `repo` parameter, which shallow-clones a public
# repository. Every other path works without it, so the step degrades rather
# than failing when git is absent.
[[tools]]
id = "git"
command = "git"
required = false

[[tools.install]]
manager = "brew"
package = "git"

[[tools.install]]
manager = "apt"
package = "git"
